<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulär</h1>
    </header>
    <main>
        <form action="tack.html" method="post">
            <label for="namn">Namn: </label>
            <input type="text" id="namn" placeholder="Ange användarnamn" name="namn" required><br><br>
            <label for="lösenord">Lösenord: </label>
            <input type="password" id="lösenord" placeholder="Lösenord" maxlength="6" name="lösenord" required><br><br>
            <label for="email">Email: </label>
            <input type="email"  id="email" placeholder="@hotmail.com">
            
            <p>Erfarenhet</p>
            <label for="html">Html</label>
            <input type="checkbox" id="html" name="välj"><br>
            <label for="css">Css</label>
            <input type="checkbox" id="css" name="välj"><br><br>

            <p>Kön</p>
            <label class="radio">
                <input type="radio" name="kon" value="man" checked>    
                Man
            </label><br>
            <label class="radio">
                <input type="radio" name="kon" value="kvinna">
                Kvinna
            </label>


        </form>
    </main>
</body>
</html>
